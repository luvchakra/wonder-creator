name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the workflow token.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Turbopack's build cache and TypeScript's incremental state (docs/performance.md › Build and deploy): restored
      # on every run, saved from main, so a build compiles only what changed.
      - uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Placeholders so the build doesn't depend on real credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

  db:
    name: Database security (RLS) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run test:db
      - name: Generated types are up to date
        run: |
          npx supabase gen types typescript --local > /tmp/types.ts
          diff -u packages/db/src/database.types.ts /tmp/types.ts

  # The end-to-end suite in four parts at once, each with its own database and app (docs/performance.md › Build and
  # deploy). Tests within a part still run one at a time, as before.
  e2e-shard:
    name: End-to-end (Playwright) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Turbopack's build cache and TypeScript's incremental state (docs/performance.md › Build and deploy): restored
      # on every run, saved from main, so a build compiles only what changed.
      - uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx supabase start
      - name: Configure app for the local stack
        run: |
          npx supabase status -o json > /tmp/sb.json
          node -e '
            const d = require("/tmp/sb.json");
            require("fs").writeFileSync("apps/web/.env.local", [
              `NEXT_PUBLIC_SUPABASE_URL=${d.API_URL}`,
              `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${d.PUBLISHABLE_KEY}`,
              `SUPABASE_SECRET_KEY=${d.SECRET_KEY}`,
              "CRON_SECRET=ci-cron-secret-0000000000000000",
              "WONDERCREATOR_AI_PROVIDER=offline",
              // Payments e2e: a key Stripe refuses (checkout fails honestly) and a test-only webhook secret.
              "STRIPE_SECRET_KEY=e2e-not-a-real-key",
              "STRIPE_WEBHOOK_SECRET=e2e-webhook-secret",
            ].join("\n"));'
      - run: npm run build
      - name: Start app
        run: |
          (cd apps/web && npx next start -p 3000 > /tmp/next.log 2>&1 &)
          npx wait-on http://localhost:3000/sign-in --timeout 120000
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          PLAYWRIGHT_CHROMIUM_PATH: ""
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            /tmp/next.log
          retention-days: 7

  # One result under the check's usual name, so branch rules that require "End-to-end (Playwright)" keep working.
  e2e:
    name: End-to-end (Playwright)
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All parts passed
        run: |
          echo "Parts: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = "success"
