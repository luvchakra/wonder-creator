name: CI

# What runs where, and why: docs/testing.md. In short —
#   pull request   fast checks only, in parallel: typecheck · lint on the changed files · unit tests related to the changed
#                  files · build. A change to dependencies, TypeScript/lint/test/build config or CI runs the whole lint and
#                  every unit test. RLS tests only when the database changes. No end-to-end. Docs-only changes run nothing.
#   push to main   the whole lint and every unit test (plus typecheck and build); RLS tests when the database changed.
#                  No end-to-end.
#   end-to-end     nightly and by hand: .github/workflows/e2e-nightly.yml.
#   manual         Actions › CI › Run workflow: the main-branch checks on any branch.
# A job that doesn't need to run is skipped, which counts as passing for required checks.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Pushes to main are never cancelled (each merged commit keeps its result
# and saves the caches).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.c.outputs.code }}
      db: ${{ steps.c.outputs.db }}
      full: ${{ steps.c.outputs.full }}
      files: ${{ steps.c.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Everything the PR touches that still exists (deleted files can't be linted or have tests related to them).
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! all="$(git diff --name-only "$BASE...$HEAD")" || ! present="$(git diff --name-only --diff-filter=d "$BASE...$HEAD")"; then
            all=""; present=""; nobase=true
          else
            nobase=false
          fi
          printf '%s\n' "$all"
          code=true; db=false; full=false
          # Docs and Markdown only: nothing to build or test.
          if [ "$nobase" = false ] && ! grep -qvE '^docs/|\.md$' <<<"$all"; then code=false; fi
          if grep -qE '^(supabase/|tests/db/|packages/db/)' <<<"$all"; then db=true; fi
          # Whole lint and every unit test: on main, by hand, without a usable base, or when the PR changes what every
          # check depends on — dependencies, TypeScript, lint, test or build config, the test stubs, or CI itself.
          if [ "$EVENT" != "pull_request" ] || [ "$nobase" = true ] || grep -qE \
             '^(package(-lock)?\.json|(apps|packages)/[^/]+/package\.json|tsconfig[^/]*\.json|apps/web/tsconfig[^/]*\.json|vitest\.config\.[cm]?[jt]s|eslint\.config\.[cm]?js|apps/web/eslint\.config\.[cm]?js|apps/web/next\.config\.[cm]?[jt]s|playwright\.config\.ts|tests/stubs/|\.github/)' <<<"$all"; then
            full=true
          fi
          # A change to CI itself also runs the RLS tests.
          if grep -qE '^\.github/workflows/ci\.yml$' <<<"$all"; then code=true; db=true; fi
          files="$(printf '%s\n' "$present" | jq -R . | jq -cs 'map(select(length > 0))')"
          printf 'code=%s\ndb=%s\nfull=%s\nfiles=%s\n' "$code" "$db" "$full" "$files" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### What runs"
            echo "- Scope: **$([ "$full" = true ] && echo 'everything (whole lint, every unit test)' || echo 'the changed files (lint) and the unit tests related to them')**"
            echo "- Code checks: $code · RLS tests: $db · End-to-end: nightly (e2e-nightly.yml)"
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc's incremental state for both projects (packages + tests, and the app): file versions are content hashes, so
      # it is safe across checkouts. Types can't be checked per file, so this is always the whole project.
      - uses: actions/cache/restore@v4
        with:
          path: |
            tsconfig.tsbuildinfo
            apps/web/tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'apps/web/tsconfig.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'apps/web/tsconfig.json') }}-
      - run: npm run typecheck
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            tsconfig.tsbuildinfo
            apps/web/tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'apps/web/tsconfig.json') }}-${{ github.sha }}

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ESLint's own cache, keyed on file content (a fresh checkout changes every mtime): unchanged files reuse their result.
      - uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-
      - name: Lint (whole repository)
        if: needs.changes.outputs.full == 'true'
        run: npx eslint . --cache --cache-strategy content --cache-location apps/web/.next/cache/eslint/
      - name: Lint (changed files)
        if: needs.changes.outputs.full != 'true'
        env:
          FILES: ${{ needs.changes.outputs.files }}
        run: |
          # File names go through xargs, never the shell, so route folders like (studio)/[id] stay literal.
          jq -r '.[] | select(test("\\.(c|m)?(j|t)sx?$"))' <<<"$FILES" > /tmp/lint-files
          if [ ! -s /tmp/lint-files ]; then echo "No JavaScript or TypeScript files changed."; exit 0; fi
          cat /tmp/lint-files
          xargs -d '\n' -a /tmp/lint-files npx eslint --no-warn-ignored --cache --cache-strategy content --cache-location apps/web/.next/cache/eslint/
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: apps/web/.next/cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-${{ github.sha }}

  test:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (all)
        if: needs.changes.outputs.full == 'true'
        run: npm test
      - name: Unit tests (related to the changed files)
        if: needs.changes.outputs.full != 'true'
        env:
          FILES: ${{ needs.changes.outputs.files }}
        run: |
          # Vitest follows the import graph from each changed file to the tests that reach it, across packages.
          jq -r '.[]' <<<"$FILES" > /tmp/changed-files
          if [ ! -s /tmp/changed-files ]; then echo "Nothing changed that tests could relate to."; exit 0; fi
          xargs -d '\n' -a /tmp/changed-files npx vitest related --run --project unit --passWithNoTests

  # The production build stays on pull requests: a merge to main deploys at once, and this is the only check that catches
  # a build break before it does. It runs beside the others (~45 s with its cache), so it doesn't lengthen the gate.
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Turbopack's build cache: restored on every run, saved from main, so a build compiles only what changed.
      - uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          # Placeholders so the build doesn't depend on real credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

  # One result under the gate's long-standing name, so a branch rule that requires it keeps working: passes when the four
  # passed, or weren't needed (skipped); fails on any failure or cancellation.
  check:
    name: Lint, typecheck, unit tests, build
    needs: [lint, typecheck, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All passed (or not needed)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Jobs: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done

  # Only when the database changes: migrations are applied to production by the Database migrations workflow on merge,
  # so a broken policy or migration has to be caught here, before it ships. The whole suite also runs nightly.
  db:
    name: Database security (RLS) tests
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run test:db
      - name: Generated types are up to date
        run: |
          npx supabase gen types typescript --local > /tmp/types.ts
          diff -u packages/db/src/database.types.ts /tmp/types.ts

  # Kept under its long-standing name so a branch rule that requires it keeps working. End-to-end no longer runs on pull
  # requests or merges; it runs nightly (e2e-nightly.yml), and risky changes run their specs locally first (docs/testing.md).
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "End-to-end runs nightly (.github/workflows/e2e-nightly.yml), not on pull requests. See docs/testing.md."
